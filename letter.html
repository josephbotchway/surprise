<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Favorite Person ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="letter-page">

<!-- Background -->
<div class="background"></div>

<!-- Dark Overlay -->
<div class="overlay"></div>

<!-- Opening Screen -->
<div id="intro">

    <div class="intro-box">

        <h1>❤️</h1>

        <h2>For My Favorite Person</h2>

        <p>
            This isn't just a letter.
            <br><br>
            It's my heart.
        </p>

        <button id="startButton">
            Begin ❤️
        </button>

    </div>

</div>


<!-- Main Experience -->

<div id="experience">

<audio id="voice" src="media/voice.mp3"></audio>

<audio id="music" src="media/music.mp3" loop></audio>

<div class="lyrics-wrapper">

<button id="resetLyrics">
    Restart Letter ❤️
</button>

<div id="lyrics">

</div>

</div>

</div>



<!-- Ending -->

<div id="ending">

<div class="ending-box">

<h1>❤️</h1>

<h2>Forever Yours</h2>

<p>

No matter where life takes us...

<br><br>

My heart will always choose you.

</p>

</div>

</div>



<script src="script.js"></script>

</body>

</html>
